services:
  swarm-egress-proxy:
    build:
      context: ./apps/runner/egress-proxy
    image: swarm-agent-egress-proxy:local
    container_name: swarm-egress-proxy
    restart: unless-stopped
    networks:
      swarm-agent-egress:
        ipv4_address: 172.30.0.2
      swarm-egress-outbound:
        gw_priority: 1
    expose:
      - "3128"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=13,gid=13,mode=700
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=32m,uid=13,gid=13,mode=700
    mem_limit: 256m
    cpus: 0.50
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "squidclient -h 127.0.0.1 -p 3128 http://registry.npmjs.org/-/ping 2>/dev/null | grep -q '200 OK'"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 5s

networks:
  swarm-agent-egress:
    name: swarm-agent-egress
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  swarm-egress-outbound:
    name: swarm-egress-outbound
