services:
  - type: web
    name: swarm-bridge
    runtime: node
    plan: free
    buildCommand: npm --prefix apps/bridge install --no-audit --no-fund
    startCommand: npm --prefix apps/bridge start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_BASE_URL
        sync: false
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: APP_ACCESS_KEY
        sync: false

  - type: web
    name: swarm-worker
    runtime: docker
    plan: free
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: ./apps/worker
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3100"
      - key: WORKER_SHARED_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_FALLBACK_PROVIDERS
        sync: false
      - key: HISTORY_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: ./data/swarm.sqlite
