name: Agent IDE and diagnostics

on:
  pull_request:
    paths:
      - 'apps/worker/**'
      - 'apps/agent-ide/**'
      - 'docs/diagnostics/**'
      - 'docs/agent-ide/**'
      - '.github/workflows/agent-ide-diagnostics.yml'
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'apps/agent-ide/**'
      - 'docs/diagnostics/**'
      - 'docs/agent-ide/**'

permissions:
  contents: read

jobs:
  worker-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/worker/package-lock.json
      - run: npm ci --prefix apps/worker --no-audit --no-fund
      - run: npm --prefix apps/worker test
      - run: npm --prefix apps/worker run check

  ide-image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/agent-ide
          file: ./apps/agent-ide/Dockerfile
          push: false
          tags: swarm-agent-ide:ci
