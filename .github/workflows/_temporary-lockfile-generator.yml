name: Temporary lockfile generator
on:
  push:
    branches: [chore/package-lockfiles]
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/package-lockfiles
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate reproducible dependency lockfiles
        run: |
          npm --prefix apps/bridge install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm --prefix apps/worker install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bridge/package-lock.json apps/worker/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already up to date"
          else
            git commit -m "chore: add npm package lockfiles"
            git push origin "HEAD:chore/package-lockfiles"
          fi
