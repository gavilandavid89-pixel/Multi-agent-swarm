http_port 3128

acl swarm_runner src 172.30.0.0/24
acl proxy_local src 127.0.0.1/32 ::1/128
acl allowed_domains dstdomain "/etc/squid/allowed-domains.txt"
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT
acl manager proto cache_object

# Local-only health/readiness check; management endpoints remain blocked to all other clients.
http_access allow proxy_local manager
http_access deny manager

acl private_dst dst 0.0.0.0/8
acl private_dst dst 10.0.0.0/8
acl private_dst dst 100.64.0.0/10
acl private_dst dst 127.0.0.0/8
acl private_dst dst 169.254.0.0/16
acl private_dst dst 172.16.0.0/12
acl private_dst dst 192.168.0.0/16
acl private_dst dst 224.0.0.0/4
acl private_dst dst 240.0.0.0/4
acl private_dst dst ::/128
acl private_dst dst ::1/128
acl private_dst dst fc00::/7
acl private_dst dst fe80::/10
acl private_dst dst ff00::/8
acl private_dst dst 2001:db8::/32

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_localhost
http_access deny private_dst
http_access allow proxy_local allowed_domains
http_access allow swarm_runner allowed_domains
http_access deny all

cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr
pid_filename none
coredump_dir /var/spool/squid
